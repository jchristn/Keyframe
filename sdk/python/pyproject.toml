[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "keyframe_sdk"
version = "0.1.0"
description = "Python client for Keyframe: summaries and typed metadata fields extracted from images and video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joel Christner" }]
keywords = ["keyframe", "video", "image", "metadata", "extraction", "summarization", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/jchristn/Keyframe"

[tool.hatch.build.targets.wheel]
packages = ["src/keyframe_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
