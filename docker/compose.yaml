# Keyframe stack: server, dashboard, MCP server, speech to text (speaches), and the observability stack
# (OpenTelemetry Collector, Prometheus, Tempo, Loki, Grafana). Vision and text models come from Ollama on the
# host (host.docker.internal:11434): ollama pull gemma3:4b qwen3-vl:8b gpt-oss:20b
# The listening model (it hears audio, not only transcripts) comes from llama-server on the host
# (host.docker.internal:8720): llama-server -hf ggml-org/Voxtral-Mini-3B-2507-GGUF:Q4_K_M --port 8720
#
#   docker compose up -d                        # everything except the optional model containers
#   docker compose --profile ollama up -d       # also run Ollama in a container (models persist in ./ollama-models)
#   docker compose --profile listen up -d       # also run llama-server on CPU (models persist in ./llama-models)
#   docker compose --profile listen-gpu up -d   # also run vLLM with Voxtral on an NVIDIA GPU (models persist in ./vllm-models)
#
# The server starts only after every model container in an active profile is healthy (depends_on with
# required: false; Docker Compose 2.20 or later), so the first start with a model profile waits for the model
# download. Model servers that run on the host cannot be ordered; Keyframe falls back to the transcript and reports
# Listening.Reason EndpointUnhealthy while the listening server is down.
#
# Host ports: server 8700, dashboard 8701, MCP 8702 (HTTP) / 8703 (TCP) / 8704 (WebSocket), Whisper 8000,
# llama-server 8720, vLLM 8730, Grafana 3700, Prometheus 9700, Tempo 3710, OTLP 4717 (gRPC) / 4718 (HTTP).
# Disk and memory for listening: about 3 to 4 GB of disk and 4 to 6 GB of RAM for the CPU model; an NVIDIA GPU with
# about 10 GB of free memory for vLLM.
# Observability ports are bound to host loopback only: Prometheus, Tempo, Loki, and the collector have no
# authentication of their own.

name: keyframe

services:

  # ------------------------------------------------------------------
  # Keyframe REST server
  # ------------------------------------------------------------------
  keyframe-server:
    container_name: keyframe-server
    # The Prometheus scrape endpoint binds this hostname and answers only requests addressed to it.
    hostname: keyframe-server
    image: 'jchristn77/keyframe-server:v0.1.0'
    ports:
      - "8700:8700"
    # The in-process Prometheus endpoint (9464) stays on the compose network: it is anonymous.
    environment:
      KEYFRAME_SETTINGS_FILE: /app/config/keyframe.json
      # Optional overrides; uncomment or set in an untracked .env file. Never commit real keys.
      # KEYFRAME_ADMIN_API_KEY: "${KEYFRAME_ADMIN_API_KEY}"
      # KEYFRAME_ACCESS_KEY: "${KEYFRAME_ACCESS_KEY}"
    volumes:
      - ./keyframe.json:/app/config/keyframe.json
      - data:/app/data
      - temp:/app/temp
      - logs:/app/logs
    # The default endpoints in keyframe.json reach the host's Ollama at host.docker.internal:11434 and the host's
    # llama-server at host.docker.internal:8720.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # The collector image is distroless (no shell, curl, or wget), so it cannot carry a healthcheck.
      otel-collector:
        condition: service_started
      # Model containers boot first when their profile is active; required: false skips them when it is not.
      ollama:
        condition: service_healthy
        required: false
      keyframe-llama:
        condition: service_healthy
        required: false
      keyframe-vllm:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8700/v1.0/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s
    # POST /v1.0/restart exits with code 0; the runtime relaunches the server and it rereads keyframe.json.
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Keyframe dashboard (React, served by nginx)
  # ------------------------------------------------------------------
  keyframe-dashboard:
    container_name: keyframe-dashboard
    image: 'jchristn77/keyframe-dashboard:v0.1.0'
    ports:
      - "8701:8701"
    environment:
      # Address the operator's browser uses to reach the server.
      KEYFRAME_SERVER_URL: "http://keyframe-server:8700"
    depends_on:
      keyframe-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8701/healthz"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Keyframe MCP server (Voltaic): HTTP 8702, TCP 8703, WebSocket 8704
  # ------------------------------------------------------------------
  keyframe-mcp:
    container_name: keyframe-mcp
    image: 'jchristn77/keyframe-mcp:v0.1.0'
    ports:
      - "8702:8702"
      - "8703:8703"
      - "8704:8704"
    environment:
      KEYFRAME_URL: "http://keyframe-server:8700"
      KEYFRAME_ACCESS_KEY: "${KEYFRAME_ACCESS_KEY:-default}"
      KEYFRAME_MCP_HOSTNAME: "*"
    depends_on:
      keyframe-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8702/"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Speech to text: speaches (OpenAI-compatible /v1/audio/transcriptions, faster-whisper on CPU).
  # The default "whisper" endpoint in keyframe.json points here (http://keyframe-whisper:8000/v1).
  # Bound to host loopback because it has no authentication; local (non-Docker) servers use 127.0.0.1:8000.
  # Models are cached in the whisper-models volume.
  # ------------------------------------------------------------------
  keyframe-whisper:
    container_name: keyframe-whisper
    image: 'ghcr.io/speaches-ai/speaches:0.8.3-cpu'
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENABLE_UI: "false"
      WHISPER__COMPUTE_TYPE: int8
      # Keep the model loaded instead of unloading it after 300 idle seconds.
      WHISPER__TTL: "-1"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # speaches 0.8.3 does not download models on demand: until a model is installed, transcription returns 404.
  # This one-shot job installs Systran/faster-whisper-small (about 460 MB) into the volume and exits; it is a
  # no-op once the model is cached. Re-run it with: docker compose run --rm keyframe-whisper-init
  keyframe-whisper-init:
    container_name: keyframe-whisper-init
    image: 'ghcr.io/speaches-ai/speaches:0.8.3-cpu'
    entrypoint: ["curl", "-fsS", "-X", "POST", "http://keyframe-whisper:8000/v1/models/Systran/faster-whisper-small"]
    depends_on:
      keyframe-whisper:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------
  # Optional Ollama in a container: docker compose --profile ollama up -d
  # The default endpoints use the host's Ollama (host.docker.internal:11434). To use this container instead,
  # stop the host Ollama (both bind port 11434) and point the ollama-* endpoints in keyframe.json at
  # http://ollama:11434.
  #
  # Model stores: Ollama keeps models in ./ollama-models, llama-server in ./llama-models, and vLLM in ./vllm-models.
  # Each is a bind mount, not a named volume, and factory resets keep all three.
  #
  # Models live in ./ollama-models on the host (a bind mount, not a named volume), so they survive restarts,
  # "docker compose down", "docker compose down -v", image updates, and factory resets. Delete that folder to
  # reclaim the space. keyframe-ollama-init pulls the default models on first start; it is a quick no-op once
  # they are present. Pull others with: docker exec keyframe-ollama ollama pull <model>
  # ------------------------------------------------------------------
  ollama:
    container_name: keyframe-ollama
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Keep a model loaded for 30 minutes after its last request instead of the default 5.
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ./ollama-models:/root/.ollama
    healthcheck:
      # The ollama image ships no curl; the CLI queries the local API instead.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  # Pulls the default models into ./ollama-models once (gemma3:4b about 3.3 GB, qwen3-vl:8b about 6.1 GB,
  # gpt-oss:20b about 13 GB). Models already present are verified and skipped without downloading again.
  # Re-run with: docker compose --profile ollama run --rm keyframe-ollama-init
  keyframe-ollama-init:
    container_name: keyframe-ollama-init
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c", "for m in gemma3:4b qwen3-vl:8b gpt-oss:20b; do ollama pull $$m || exit 1; done"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------
  # Optional llama-server in a container (CPU): docker compose --profile listen up -d
  # The default llama-listen endpoint uses the host's llama-server (host.docker.internal:8720), which is much faster
  # on Apple Silicon because Docker has no Metal access. To use this container instead, stop the host llama-server
  # (both bind port 8720) or point llama-listen in keyframe.json at http://keyframe-llama:8080/v1.
  #
  # -hf downloads the model and its audio projector into ./llama-models (LLAMA_CACHE) on the first start and reuses
  # them afterward, so restarts, image updates, and factory resets never download again. Set LLAMA_THREADS in an
  # untracked .env file to change the CPU thread count (default 4). Bound to host loopback: llama-server has no
  # authentication.
  # ------------------------------------------------------------------
  keyframe-llama:
    container_name: keyframe-llama
    image: 'ghcr.io/ggml-org/llama.cpp:server-b12063'
    profiles: ["listen"]
    ports:
      - "127.0.0.1:8720:8080"
    environment:
      LLAMA_CACHE: /models
    command: ["-hf", "ggml-org/Voxtral-Mini-3B-2507-GGUF:Q4_K_M", "--host", "0.0.0.0", "--port", "8080", "-c", "16384", "--threads", "${LLAMA_THREADS:-4}"]
    volumes:
      - ./llama-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      # Covers the first model download (a few GB).
      start_period: 1800s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Optional vLLM with Voxtral Mini 3B on an NVIDIA GPU: docker compose --profile listen-gpu up -d
  # Needs an NVIDIA GPU with about 10 GB of free memory and the NVIDIA container toolkit. Models persist in
  # ./vllm-models. HF_TOKEN is read from an untracked .env file when the model requires it. The vllm-voxtral
  # endpoint ships inactive; activate it and set Inference.DefaultListening to it on the Settings page.
  # Bound to host loopback: vLLM has no authentication here.
  # ------------------------------------------------------------------
  keyframe-vllm:
    container_name: keyframe-vllm
    # docker/vllm/Dockerfile adds the audio extras Voxtral needs to the pinned vllm/vllm-openai:v0.33.0 image.
    build: ./vllm
    image: 'keyframe-vllm-audio:v0.33.0'
    profiles: ["listen-gpu"]
    ports:
      - "127.0.0.1:8730:8000"
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    # VLLM_GPU_MEMORY_UTILIZATION is the share of GPU memory vLLM reserves (default 0.85). Lower it on a GPU shared
    # with other model servers, and on unified-memory systems such as NVIDIA GB10, where it is a share of system RAM.
    command: ["--model", "mistralai/Voxtral-Mini-3B-2507", "--tokenizer_mode", "mistral", "--config_format", "mistral", "--load_format", "mistral",
      "--gpu-memory-utilization", "${VLLM_GPU_MEMORY_UTILIZATION:-0.85}", "--max-model-len", "${VLLM_MAX_MODEL_LEN:-32768}", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./vllm-models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Python is always present in the vLLM image; curl may not be.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 1800s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Observability
  #
  # The server pushes traces and logs over OTLP to the collector, which forwards traces to Tempo and logs to
  # Loki. Prometheus scrapes the server's in-process /metrics endpoint directly.
  # ------------------------------------------------------------------
  otel-collector:
    container_name: keyframe-otel-collector
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otel-collector.yaml"]
    ports:
      - "127.0.0.1:4717:4317"
      - "127.0.0.1:4718:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    container_name: keyframe-prometheus
    image: prom/prometheus:v3.5.4
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9700:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus:/prometheus
    healthcheck:
      # The prometheus image ships wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  tempo:
    container_name: keyframe-tempo
    # Pinned: later tags reject the standard ingester and compactor configuration sections.
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3710:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo
    healthcheck:
      # The tempo image ships wget, not curl. /ready returns 503 until ready, then 200.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s
    restart: unless-stopped

  loki:
    container_name: keyframe-loki
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yaml"]
    # Not published on the host; Grafana and the collector reach it on the compose network.
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    healthcheck:
      # The loki image ships busybox wget, not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 40s
    restart: unless-stopped

  grafana:
    container_name: keyframe-grafana
    image: grafana/grafana-oss:13.0.2
    ports:
      - "127.0.0.1:3700:3000"
    environment:
      # Local development defaults. Override GRAFANA_ADMIN_PASSWORD (for example in an untracked .env file)
      # for any shared or hosted deployment; never commit a real password here.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/keyframe/keyframe-overview.json
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/keyframe:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
    restart: unless-stopped

volumes:
  data:
  temp:
  logs:
  whisper-models:
  prometheus:
  tempo:
  loki:
  grafana:
